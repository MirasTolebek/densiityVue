<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор в Стиле Apple</title>
    <!-- Загрузка Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Настройка шрифта Inter и адаптивных классов Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'primary-apple': '#007AFF', // Синий цвет Apple
                        'success-apple': '#34C759', // Зеленый цвет Apple для успеха
                        'error-apple': '#FF3B30',  // Красный цвет Apple для ошибок
                        'card-light': '#FFFFFF',
                        'bg-light': '#F0F2F5', // Очень светлый фон
                        'card-dark': '#1C1C1E', // Почти черный для темной темы
                        'bg-dark': '#000000', // Чистый черный фон для OLED/Apple Dark Mode
                    }
                }
            }
        }
    </script>
    <style>
        /* Общие стили для фона и центрирования */
        .container-wrapper {
            display: flex;
            align-items: center; /* Центрирование для ПК/планшета по умолчанию */
            justify-content: center;
            padding: 1rem; 
            min-height: 100vh; 
            overflow-y: auto; 
        }
        
        /* Адаптивные стили для мобильных устройств (менее 640px) */
        @media (max-width: 640px) {
            .container-wrapper {
                align-items: flex-start; /* Прижимаем контент к верху */
                padding-top: 4rem; /* УВЕЛИЧЕННЫЙ отступ сверху для заголовка Telegram Mini App */
                padding-bottom: 0; /* Удаляем нижний отступ, чтобы не было зазора над клавиатурой */
                min-height: 100%; 
            }
        }

        /* Стиль для чистого Apple-подобного ввода */
        .apple-input {
            transition: all 0.2s ease-in-out;
            /* Небольшая тень для эффекта "вдавленности" */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05) inset;
        }
        .apple-input:focus {
            outline: none;
            border-color: '#007AFF'; /* Синий акцент при фокусе */
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.3);
        }
        .dark .apple-input {
             /* Убираем тень при инверсии цвета в темной теме */
            box-shadow: none;
            border-color: #38383a;
            background-color: #38383a;
        }
        .dark .apple-input:focus {
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.5);
            border-color: #007AFF;
        }

        /* Настройка внешнего вида для темной/светлой темы */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000000; /* Чистый черный */
                color: #FFFFFF;
            }
        }
        @media (prefers-color-scheme: light) {
            body {
                background-color: #F0F2F5; /* Очень светлый фон */
                color: #1C1C1E;
            }
        }
        
        /* Убедимся, что body занимает всю высоту */
        html, body {
            height: 100%;
        }
    </style>
</head>
<body class="font-sans transition-colors duration-500">

<div class="container-wrapper">
    <!-- Основной контейнер калькулятора (Apple Card Style) -->
    <div class="w-full max-w-sm p-6 bg-card-light dark:bg-card-dark rounded-3xl shadow-xl transition-all duration-500 transform hover:shadow-2xl">
        
        <!-- Заголовок в стиле iOS -->
        <h1 class="text-4xl font-black text-center text-gray-900 dark:text-white mb-2">
            Калькулятор
        </h1>
        <p class="text-center text-sm font-light text-gray-500 dark:text-gray-400 mb-8">
            Расчет содержания твёрдого в процентах
        </p>

        <!-- Раздел результатов (Дисплей Калькулятора) -->
        <div class="p-4 mb-8 rounded-2xl bg-gray-100 dark:bg-[#2C2C2E] shadow-inner">
            <div class="text-lg font-normal text-gray-500 dark:text-gray-300 mb-2 text-right">
                % тв
            </div>
            
            <!-- Анимированное отображение процента -->
            <div id="percentResult" class="text-7xl font-bold text-success-apple dark:text-success-apple text-right transition-colors duration-300 whitespace-nowrap">
                — %
            </div>
        </div>

        <!-- Поле ввода веса -->
        <div class="mb-6">
            <label for="weightInput" class="block text-xs uppercase tracking-wider font-medium text-gray-500 dark:text-gray-300 mb-2">
                Вес (г)
            </label>
            <input 
                type="number" 
                id="weightInput" 
                placeholder="1038.00 - 2065.00"
                class="apple-input w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-xl shadow-md text-xl bg-card-light dark:text-white dark:bg-[#38383a]"
                min="1038"
                max="2065"
                step="0.01"
            >
        </div>

        <!-- Кнопка копирования -->
        <button 
            id="copyButton" 
            onclick="handleCopy()" 
            class="w-full py-3 bg-primary-apple text-white rounded-xl text-lg font-medium shadow-lg transition-all duration-200 hover:opacity-90 active:scale-[0.99] disabled:opacity-50"
            disabled
        >
            Копировать % тв
        </button>
    </div>
</div>

<script>
    // Исходные данные для интерполяции
    const INTERPOLATION_DATA = [
        { "weight": 1038, "percent": 5 },
        { "weight": 1046, "percent": 6 },
        { "weight": 1054, "percent": 7 },
        { "weight": 1063, "percent": 8 },
        { "weight": 1071, "percent": 9 },
        { "weight": 1080, "percent": 10 },
        { "weight": 1088, "percent": 11 },
        { "weight": 1097, "percent": 12 },
        { "weight": 1106, "percent": 13 },
        { "weight": 1115, "percent": 14 },
        { "weight": 1124, "percent": 15 },
        { "weight": 1133, "percent": 16 },
        { "weight": 1143, "percent": 17 },
        { "weight": 1153, "percent": 18 },
        { "weight": 1163, "percent": 19 },
        { "weight": 1173, "percent": 20 },
        { "weight": 1184, "percent": 21 },
        { "weight": 1195, "percent": 22 },
        { "weight": 1204, "percent": 23 },
        { "weight": 1215, "percent": 24 },
        { "weight": 1226, "percent": 25 },
        { "weight": 1237, "percent": 26 },
        { "weight": 1248, "percent": 27 },
        { "weight": 1272, "percent": 29 },
        { "weight": 1284, "percent": 30 },
        { "weight": 1296, "percent": 31 },
        { "weight": 1309, "percent": 32 },
        { "weight": 1321, "percent": 33 },
        { "weight": 1334, "percent": 34 },
        { "weight": 1348, "percent": 35 },
        { "weight": 1361, "percent": 36 },
        { "weight": 1375, "percent": 37 },
        { "weight": 1383, "percent": 38 },
        { "weight": 1403, "percent": 39 },
        { "weight": 1418, "percent": 40 },
        { "weight": 1433, "percent": 41 },
        { "weight": 1448, "percent": 42 },
        { "weight": 1464, "percent": 43 },
        { "weight": 1480, "percent": 44 },
        { "weight": 1496, "percent": 45 },
        { "weight": 1513, "percent": 46 },
        { "weight": 1539, "percent": 47 },
        { "weight": 1547, "percent": 48 },
        { "weight": 1565, "percent": 49 },
        { "weight": 1583, "percent": 50 },
        { "weight": 1621, "percent": 52 },
        { "weight": 1661, "percent": 54 },
        { "weight": 1703, "percent": 56 },
        { "weight": 1746, "percent": 58 },
        { "weight": 1792, "percent": 60 },
        { "weight": 1841, "percent": 62 },
        { "weight": 1892, "percent": 64 },
        { "weight": 1947, "percent": 66 },
        { "weight": 2004, "percent": 68 },
        { "weight": 2065, "percent": 70 }
    ];

    // Константы для границ
    const MIN_PERCENT = 5.00;
    const MAX_PERCENT = 70.00;
    const MIN_WEIGHT = INTERPOLATION_DATA[0].weight;
    const MAX_WEIGHT = INTERPOLATION_DATA[INTERPOLATION_DATA.length - 1].weight;

    // Элементы DOM
    const weightInput = document.getElementById('weightInput');
    const percentResultDiv = document.getElementById('percentResult');
    const copyButton = document.getElementById('copyButton');
    
    // Переменная для хранения последнего рассчитанного значения
    let lastCalculatedPercent = null;


    /**
     * Плавно анимирует отображение числа от 0 до целевого значения.
     * @param {number} targetValue - Конечный процент (ТВ).
     */
    function animateCount(targetValue) {
        const duration = 700; // 0.7 секунды для плавной анимации
        const start = performance.now();
        const startValue = 0;

        // Обновляем последнее рассчитанное значение
        lastCalculatedPercent = targetValue; 

        function step(currentTime) {
            const elapsed = currentTime - start;
            const progress = Math.min(elapsed / duration, 1);
            
            // Вычисляем текущее значение, используя плавную кривую (ease-out)
            const easedProgress = progress * (2 - progress);
            const currentValue = startValue + (targetValue - startValue) * easedProgress;
            
            // Обновляем дисплей, округляем до двух знаков после запятой
            percentResultDiv.textContent = `${currentValue.toFixed(2)} %`;

            if (progress < 1) {
                requestAnimationFrame(step);
            } else {
                 // Убеждаемся, что конечное значение точно соответствует целевому
                 percentResultDiv.textContent = `${targetValue.toFixed(2)} %`;

                 // Применяем цвета в зависимости от границ
                 if (targetValue === MIN_PERCENT || targetValue === MAX_PERCENT) {
                     percentResultDiv.classList.add('text-error-apple'); // Красный для границы
                     percentResultDiv.classList.remove('text-success-apple');
                 } else {
                     percentResultDiv.classList.add('text-success-apple'); // Зеленый для нормального значения
                     percentResultDiv.classList.remove('text-error-apple');
                 }
            }
        }
        
        // Сброс цвета перед началом анимации
        percentResultDiv.classList.remove('text-error-apple', 'text-success-apple');

        requestAnimationFrame(step);
    }

    /**
     * Выполняет линейную интерполяцию для нахождения процента по весу.
     * @param {number} weight - Входное значение веса.
     * @returns {number} Рассчитанный или ограниченный процент.
     */
    function calculatePercent(weight) {
        if (weight < MIN_WEIGHT) return MIN_PERCENT;
        if (weight > MAX_WEIGHT) return MAX_PERCENT;

        let lower = null;
        let upper = null;

        for (let i = 0; i < INTERPOLATION_DATA.length - 1; i++) {
            if (weight >= INTERPOLATION_DATA[i].weight && weight <= INTERPOLATION_DATA[i+1].weight) {
                lower = INTERPOLATION_DATA[i];
                upper = INTERPOLATION_DATA[i+1];
                break;
            }
        }
        
        if (!lower) {
            if (weight === MAX_WEIGHT) { lower = upper = INTERPOLATION_DATA[INTERPOLATION_DATA.length - 1]; } 
            else if (weight === MIN_WEIGHT) { lower = upper = INTERPOLATION_DATA[0]; }
        }

        if (lower && upper) {
            if (lower.weight === upper.weight) {
                return parseFloat(lower.percent.toFixed(2));
            } else {
                const x1 = lower.weight;
                const y1 = lower.percent;
                const x2 = upper.weight;
                const y2 = upper.percent;

                const interpolatedPercent = y1 + (weight - x1) * ((y2 - y1) / (x2 - x1));
                
                return parseFloat(interpolatedPercent.toFixed(2));
            }
        } 

        return 0;
    }

    /**
     * Основная функция-обработчик ввода.
     */
    function handleInput() {
        const rawWeight = weightInput.value;
        const weight = parseFloat(rawWeight);

        // Сброс, если ввод пустой или некорректный
        if (rawWeight.trim() === '' || isNaN(weight) || weight <= 0) {
            percentResultDiv.textContent = '— %';
            percentResultDiv.classList.remove('text-success-apple', 'text-error-apple');
            copyButton.disabled = true; // Деактивируем кнопку копирования
            return;
        }

        const calculatedPercent = calculatePercent(weight);
        
        // Запуск анимированного счетчика
        animateCount(calculatedPercent);
        copyButton.disabled = false; // Активируем кнопку копирования
    }

    /**
     * Обработчик копирования результата с округлением до ближайшего целого.
     */
    function handleCopy() {
        if (lastCalculatedPercent === null) {
            console.error("Нет значения для копирования.");
            return;
        }

        // 1. Округляем до ближайшего целого (42.30 -> 42, 42.78 -> 43)
        const roundedPercent = Math.round(lastCalculatedPercent);
        
        // 2. Форматируем строку для копирования
        const textToCopy = `${roundedPercent}%`;

        // 3. Выполняем копирование (используя временное поле для кросс-браузерной совместимости в iframe)
        const tempInput = document.createElement('textarea');
        tempInput.value = textToCopy;
        document.body.appendChild(tempInput);
        tempInput.select();
        
        try {
            document.execCommand('copy');
            
            // Визуальное подтверждение
            const originalText = copyButton.textContent;
            copyButton.textContent = "Скопировано!";
            copyButton.classList.add('bg-success-apple');
            copyButton.classList.remove('bg-primary-apple');

            setTimeout(() => {
                copyButton.textContent = originalText;
                copyButton.classList.remove('bg-success-apple');
                copyButton.classList.add('bg-primary-apple');
            }, 1500); // 1.5 секунды
            
        } catch (err) {
            console.error('Не удалось скопировать текст:', err);
        } finally {
            document.body.removeChild(tempInput);
        }
    }

    // Инициализация: Добавление слушателя события ввода
    window.onload = function() {
        weightInput.addEventListener('input', handleInput);
    };

</script>

</body>
</html>
